<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Quiz App</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card{
    padding:20px;
    margin:20px 0;
    border:2px solid #ddd;
    border-radius:10px;
    min-height:100px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

input{
    width:90%;
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Flashcard Quiz App</h2>

    <div class="card">
        <h3 id="question"></h3>
        <p id="answer" style="display:none;"></p>
    </div>

    <button onclick="showAnswer()">Show Answer</button>
    <button onclick="prevCard()">Previous</button>
    <button onclick="nextCard()">Next</button>

    <hr>

    <h3>Add New Flashcard</h3>

    <input type="text" id="newQuestion" placeholder="Enter Question">
    <input type="text" id="newAnswer" placeholder="Enter Answer">
    <br>
    <button onclick="addCard()">Add Card</button>
    <button onclick="deleteCard()">Delete Current Card</button>
</div>

<script>

let flashcards = [
    {
        question:"What is HTML?",
        answer:"HTML stands for Hyper Text Markup Language."
    },
    {
        question:"What is CSS?",
        answer:"CSS is used for styling web pages."
    },
    {
        question:"What is JavaScript?",
        answer:"JavaScript makes web pages interactive."
    }
];

let currentCard = 0;

function displayCard(){
    document.getElementById("question").innerText =
    flashcards[currentCard].question;

    document.getElementById("answer").innerText =
    flashcards[currentCard].answer;

    document.getElementById("answer").style.display="none";
}

function showAnswer(){
    document.getElementById("answer").style.display="block";
}

function nextCard(){
    currentCard = (currentCard + 1) % flashcards.length;
    displayCard();
}

function prevCard(){
    currentCard =
    (currentCard - 1 + flashcards.length) % flashcards.length;
    displayCard();
}

function addCard(){
    let q = document.getElementById("newQuestion").value;
    let a = document.getElementById("newAnswer").value;

    if(q && a){
        flashcards.push({
            question:q,
            answer:a
        });

        alert("Flashcard Added!");

        document.getElementById("newQuestion").value="";
        document.getElementById("newAnswer").value="";
    }
    else{
        alert("Please enter both question and answer.");
    }
}

function deleteCard(){
    if(flashcards.length > 1){
        flashcards.splice(currentCard,1);
        currentCard = 0;
        displayCard();
        alert("Card Deleted!");
    }
    else{
        alert("At least one card must remain.");
    }
}

displayCard();

</script>

</body>
</html>
