<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Infobyte Business Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
        }

        /* Business Card Container (3.5" x 2" Ratio) */
        .card-container {
            width: 450px;
            height: 257px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        /* Hover effect to flip the card */
        .card-container:hover {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            background: #ffffff;
        }

        /* --- FRONT SIDE --- */
        .card-front {
            background: linear-gradient(135deg, #6C5CE7 0%, #5A4AD1 100%);
            color: #ffffff;
            align-items: center;
            justify-content: center;
        }

        .logo-area {
            text-align: center;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-subtext {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- BACK SIDE --- */
        .card-back {
            transform: rotateY(180deg);
            border: 1px solid #e1e1e1;
        }

        .header-back {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name-title h2 {
            font-size: 22px;
            color: #2d3436;
            font-weight: 700;
        }

        .name-title p {
            font-size: 13px;
            color: #6C5CE7;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .brand-badge {
            font-weight: 700;
            color: #6C5CE7;
            font-size: 14px;
        }

        .contact-details {
            margin-top: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #636e72;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .icon {
            width: 16px;
            margin-right: 10px;
            color: #6C5CE7;
            font-weight: bold;
        }

        /* Small decorative accent line */
        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #6C5CE7;
        }

        /* Hint for user interaction */
        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 12px;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hint">Hover to flip card</div>

    <div class="card-container">
        <!-- Front Side -->
        <div class="card-face card-front">
            <div class="logo-area">
                <div class="logo-text">Oasis Infobyte</div>
                <div class="logo-subtext">Design & Development</div>
            </div>
        </div>

        <!-- Back Side -->
        <div class="card-face card-back">
            <div class="header-back">
                <div class="name-title">
                    <h2>Admin</h2>
                    <p>Graphic Design Team</p>
                </div>
                <div class="brand-badge">Oasis Infobyte</div>
            </div>

            <div class="contact-details">
                <div class="contact-item">
                    <span class="icon">📞</span> +1 (555) 019-2834
                </div>
                <div class="contact-item">
                    <span class="icon">✉️</span> admin@oasisinfobyte.com
                </div>
                <div class="contact-item">
                    <span class="icon">🌐</span> oasisinfobyte.com
                </div>
                <div class="contact-item">
                    <span class="icon">📍</span> Tech Hub Suite 404, San Francisco, CA
                </div>
            </div>
            <div class="accent-bar"></div>
        </div>
    </div>

</body>
</html>
